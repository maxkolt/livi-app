# Только Alertmanager — для отдельного VPS (например, с нормальным исходящим SMTP/Telegram).
# Запуск: docker compose -f docker-compose.alertmanager-only.yml up -d
# Рядом нужны: alertmanager/alertmanager.yml (секреты), при необходимости скопируйте из alertmanager.yml.example.

services:
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - '0.0.0.0:9093:9093'
