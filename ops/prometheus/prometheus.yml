# Скрейп LiVi Node-бэкенда: GET /metrics (нужен CAPACITY_METRICS_ENABLED=1).
# Prometheus в bridge-сети compose: бэкенд на хосте — host.docker.internal (extra_hosts host-gateway в compose).
# Удалённый бэкенд или Alertmanager — замените targets ниже.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        # Имя сервиса из docker-compose. Удалённый AM: замените на <IP>:9093 (README «Два сервера»).
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: livi-backend
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          service: livi-backend

  # Опционально: метрики сервера LiveKit (отдельный процесс), если Prometheus до него достучится.
  # - job_name: livekit
  #   metrics_path: /metrics
  #   scheme: http
  #   static_configs:
  #     - targets: ['livekit.example.com:6789']
