services:
  prometheus:
    image: prom/prometheus:v2.54.1
    # Bridge-сеть: UI на localhost:9090 (Mac и Linux). Скрейп бэкенда на хосте — через host.docker.internal
    # (на Linux нужен extra_hosts host-gateway; на Docker Desktop имя уже есть).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    # При необходимости исходящего HTTP(S)-прокси (SMTP/др.): раскомментируйте и задайте URL.
    environment:
      # Secrets are loaded from ops/.env (gitignored).
      SMTP_AUTH_PASSWORD: ${SMTP_AUTH_PASSWORD}
    #   HTTP_PROXY: http://user:pass@proxy.example.com:3128
    #   HTTPS_PROXY: http://user:pass@proxy.example.com:3128
    #   NO_PROXY: 127.0.0.1,localhost
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--config.expand-env'
    ports:
      - '9093:9093'
