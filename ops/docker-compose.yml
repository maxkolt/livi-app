services:
  prometheus:
    image: prom/prometheus:v2.54.1
    # Linux VPS: общий сетевой стек с хостом — скрейп 127.0.0.1:PORT без обхода bridge→хост
    # (иначе часто timeout до :3000 с livi-ops_default). На Docker Desktop (Mac) host ≠ ваш Mac.
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    # При необходимости исходящего HTTP(S)-прокси (SMTP/др.): раскомментируйте и задайте URL.
    # environment:
    #   HTTP_PROXY: http://user:pass@proxy.example.com:3128
    #   HTTPS_PROXY: http://user:pass@proxy.example.com:3128
    #   NO_PROXY: 127.0.0.1,localhost
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - '9093:9093'
