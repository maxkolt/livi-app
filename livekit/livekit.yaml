# Порт сигнального сервера (WebSocket). Nginx/Caddy проксируют wss сюда.
port: 7880
log_level: info

# WebRTC: TCP fallback и диапазон UDP для медиа (прод: 50000-60000).
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true

# Ключи — те же, что в backend .env (LIVEKIT_API_KEY и LIVEKIT_API_SECRET).
# Подставь свои значения локально; в репозитории только плейсхолдеры.
# Сгенерировать: https://docs.livekit.io/home/self-hosting/generate-keys/ или lk CLI.
keys:
  your_api_key: "your_api_secret"