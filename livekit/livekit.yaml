# Порт сигнального сервера (WebSocket). Nginx/Caddy проксируют wss сюда.
port: 7880
log_level: info

# WebRTC: TCP fallback и локальный диапазон UDP для медиа.
rtc:
  tcp_port: 7881
  port_range_start: 52000
  port_range_end: 52050
  use_external_ip: true

# Ключи передаются через переменную окружения LIVEKIT_KEYS из livekit/.env.
# Пример значения LIVEKIT_KEYS: key1: secret1,key2: secret2