# Чат с другом ${FRIEND}: сообщение ${TEXT} уходит и появляется в ленте, поле очищается.
appId: com.kolt12max.livi.dev
---
- launchApp
- extendedWaitUntil:
    visible: "Find a partner|Найти собеседника"
    timeout: 30000
- tapOn: "Friends|Друзья"
- tapOn:
    id: "friend-row-chat"
    rightOf: "${FRIEND}"
- tapOn:
    id: "chat-input"
- inputText: "${TEXT}"
- tapOn:
    id: "chat-send"
- extendedWaitUntil:
    visible: "${TEXT}"
    timeout: 10000
- assertNotVisible:
    id: "chat-input"
    text: "${TEXT}"
