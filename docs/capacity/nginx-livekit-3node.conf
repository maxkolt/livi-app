# Upstream для 3 нод LiveKit (DoD staging).
# Подключите этот файл в основной конфиг nginx или используйте в контейнере nginx (docker-compose.staging).

upstream livekit_staging {
    least_conn;
    server livekit1:7880;
    server livekit2:7880;
    server livekit3:7880;
}

server {
    listen 7880;
    server_name _;

    location / {
        proxy_pass http://livekit_staging;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
