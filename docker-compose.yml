services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livi-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"  # Только localhost, наружу через Nginx
    env_file:
      - ./backend/.env
    # Проброс в процесс (приоритет над env_file). Для прод: CAPACITY_METRICS_ENABLED=0 в окружении или корневом .env рядом с compose.
    environment:
      CAPACITY_METRICS_ENABLED: "${CAPACITY_METRICS_ENABLED:-1}"
      # В Docker backend должен ходить в Redis по имени сервиса.
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
    depends_on:
      - redis
    volumes:
      - ./backend/public/uploads:/app/public/uploads
    networks:
      - livi-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  livekit-sfu:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    stop_grace_period: 10s
    env_file:
      - ./livekit/.env
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      # Локально используем узкий UDP-диапазон, чтобы избежать конфликтов портов.
      - "127.0.0.1:52000-52050:52000-52050/udp"
    volumes:
      - ./livekit/livekit.local.yaml:/etc/livekit.yaml:ro
    networks:
      - livi-network
    command: --config /etc/livekit.yaml

  redis:
    image: redis:7-alpine
    container_name: livi-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"  # Только localhost
    volumes:
      - redis-data:/data
    networks:
      - livi-network
    command: redis-server --appendonly yes

networks:
  livi-network:
    driver: bridge

volumes:
  redis-data:
